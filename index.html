async function api(
  action,
  payload = {}
) {
  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => {
        controller.abort();
      },
      20000
    );

  try {
    const response =
      await fetch(
        window.ZR_CONFIG.API_URL,
        {
          method:
            'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify({
              action:
                action,
              token:
                TOKEN ||
                '',
              payload:
                payload
            }),

          redirect:
            'follow',

          signal:
            controller.signal
        }
      );

    const rawText =
      await response.text();

    if (!response.ok) {
      throw new Error(
        'Backend HTTP error ' +
        response.status +
        '.'
      );
    }

    const trimmed =
      String(
        rawText ||
        ''
      ).trim();

    /*
     * Apps Script deployment/login page or wrong Web App URL
     * often returns HTML beginning with <!DOCTYPE...
     */
    if (
      trimmed.startsWith(
        '<'
      )
    ) {
      throw new Error(
        'Backend returned an HTML page instead of JSON. Please check Apps Script Web App deployment, access setting (Anyone), and config.js API_URL.'
      );
    }

    let result;

    try {
      result =
        JSON.parse(
          trimmed
        );

    } catch (parseError) {
      throw new Error(
        'Backend response is not valid JSON. Please redeploy the latest Code.gs version.'
      );
    }

    if (
      result &&
      result.ok ===
      false
    ) {
      throw new Error(
        result.error ||
        'Request failed.'
      );
    }

    return result;

  } catch (error) {
    if (
      error.name ===
      'AbortError'
    ) {
      throw new Error(
        'Server response timed out after 20 seconds. Please retry. If this continues, check Apps Script deployment and backend execution log.'
      );
    }

    throw error;

  } finally {
    clearTimeout(
      timeout
    );
  }
}

async function sendRegistrationOtp() {
  const button =
    $('regSendOtpBtn');

  try {
    setBusyButton(
      button,
      true,
      'Sending OTP...',
      'Send Email OTP'
    );

    showLoading(
      'Checking official data and sending Email OTP...'
    );

    let result;

    if (
      REGISTRATION_TYPE ===
      'CLUB'
    ) {
      result = await api(
        'sendClubRegistrationOtp',
        {
          lionId:
            regLionId.value.trim(),

          clubId:
            regClubId.value.trim(),

          personalEmail:
            regPersonalEmail.value.trim(),

          username:
            regUsername.value.trim()
        },
        ''
      );

    } else {
      result = await api(
        'sendZoneRegistrationOtp',
        {
          memberId:
            regMemberId.value.trim(),

          personalEmail:
            regPersonalEmail.value.trim(),

          username:
            regUsername.value.trim()
        },
        ''
      );

    }

    REGISTRATION_OTP_REQUEST_ID =
      result.requestId;

    regOtpArea.classList.remove(
      'hide'
    );

    regOtpMessage.textContent =
      'OTP sent to ' +
      result.maskedEmail +
      '. OTP expires soon.';

    if (
      REGISTRATION_RESEND_TIMER
    ) {
      clearInterval(
        REGISTRATION_RESEND_TIMER
      );
    }

    REGISTRATION_RESEND_TIMER =
      startButtonCountdown(
        button,
        60,
        'Resend Email OTP'
      );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

async function submitRegistration() {
  if (
    regPassword.value !==
    regConfirm.value
  ) {
    alert(
      'Password and Confirm Password do not match.'
    );

    return;

  }

  if (
    !REGISTRATION_OTP_REQUEST_ID
  ) {
    alert(
      'Send Email OTP first.'
    );

    return;

  }

  if (
    !regOtpCode.value.trim()
  ) {
    alert(
      'Enter the Email OTP.'
    );

    return;

  }

  try {
    showLoading(
      'Verifying OTP and creating account...'
    );

    let result;

    if (
      REGISTRATION_TYPE ===
      'CLUB'
    ) {
      result = await api(
        'registerClubOfficer',
        {
          lionId:
            regLionId.value.trim(),

          clubId:
            regClubId.value.trim(),

          personalEmail:
            regPersonalEmail.value.trim(),

            regUsername.value.trim(),

            regPassword.value,

          otpRequestId:
            REGISTRATION_OTP_REQUEST_ID,

            regOtpCode.value.trim()

    } else {

    alert(
      result.message +

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

function startButtonCountdown(
  button,
  seconds,
  normalText
) {
  let remaining =
    seconds;

  button.disabled =
    true;

  button.textContent =
    'Resend in ' +
    remaining +
    's';

  const timer = setInterval(
    () => {
      remaining--;

      if (
        remaining <=
        0
      ) {
        clearInterval(
          timer
        );

        button.disabled =
          false;

        button.textContent =
          normalText;

        return;
      }

      button.textContent =
        'Resend in ' +
        remaining +
        's';
    },
    1000
  );

  return timer;
}


function setBusyButton(
  button,
  busy,
  busyText,
  normalText
) {
  if (!button) {
    return;
  }

  button.disabled =
    busy;

  button.textContent =
    busy
      ? busyText
      : normalText;
}

function stopSharedSync() {
  if (
    SHARED_SYNC_TIMER
  ) {
    clearInterval(
      SHARED_SYNC_TIMER
    );

    SHARED_SYNC_TIMER =
      null;
  }
}


function startSharedSync() {
  stopSharedSync();

  if (
    !CURRENT_REPORT ||
    CURRENT_REPORT.master.Status ===
      'SUBMITTED'
  ) {
    return;
  }

  SHARED_SYNC_TIMER =
    setInterval(
      checkSharedReportRevision,
      30000
    );
}


async function checkSharedReportRevision() {
  if (
    !CURRENT_REPORT ||
    CURRENT_REPORT.master.Status ===
      'SUBMITTED'
  ) {
    return;
  }

  try {
    const data = await api(
      'getReport',
      {
        reportId:
          CURRENT_REPORT.master.ReportID
      }
    );

    const remoteRevision =
      Number(
        data.report.master.Revision ||
        1
      );

    const localRevision =
      Number(
        CURRENT_REPORT.master.Revision ||
        1
      );

    if (
      remoteRevision >
      localRevision
    ) {
      SHARED_REMOTE_REVISION =
        remoteRevision;

      const banner = $(
        'sharedUpdateBanner'
      );

      if (banner) {
        banner.classList.remove(
          'hide'
        );

        banner.innerHTML = `
          अर्को President/Secretary login बाट यो report update भएको छ।
          Latest Revision:
          <b>${remoteRevision}</b>
          <button
            class="btn btn-light"
            style="margin-left:8px"
            onclick="reloadLatestSharedReport()"
          >
            Reload Latest
          </button>
        `;
      }
    }

  } catch (error) {
    console.warn(
      'Shared revision check failed:',
      error.message
    );
  }
}

async function saveDraft(
  silent = false
) {
  if (
    !CURRENT_REPORT ||
    CURRENT_REPORT.master.Status ===
      'SUBMITTED'
  ) {
    return;

  }

  try {
    if (!silent) {
      showLoading(
        'Saving shared Club draft...'
      );

    }

    const data = await api(
      'saveDraft',
      collectPayload()
    );

    CURRENT_REPORT =
      data.report;

    if (!silent) {
      loadReportIntoForm(
        data.report
      );

      alert(
        'Draft saved. President and Secretary will see the same latest data.'
      );

    }

  } catch (error) {
    const message = String(
      error.message ||
      ''
    );

    if (
      message.startsWith(
        'CONFLICT:'
      )
    ) {
      clearInterval(
        AUTO_SAVE_TIMER
      );

      if (!silent) {
        const reload = confirm(
          message +
          '\n\nReload latest shared data now?'
        );

        if (reload) {
          await reloadLatestSharedReport();

        }

      } else {
        alert(
          'Another President/Secretary login saved a newer report revision. Auto-save stopped. Reload the latest report before continuing.'
        );

      }

      return;

    }

    if (!silent) {
      alert(
        error.message
      );

    }

  } finally {
    if (!silent) {
      hideLoading();

    }
  }
}

async function reloadLatestSharedReport() {
  if (!CURRENT_REPORT) {
    return;

  }

  try {
    showLoading(
      'Loading latest shared report...'
    );

    const data = await api(
      'getReport',
      {
        reportId:
          CURRENT_REPORT.master.ReportID
      }
    );

    loadReportIntoForm(
      data.report
    );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

function startAutoSave(){clearInterval(AUTO_SAVE_TIMER);

if(CURRENT_REPORT&&CURRENT_REPORT.master.Status!=='SUBMITTED')AUTO_SAVE_TIMER=setInterval(()=>saveDraft(true),60000)}

async function downloadYearBackup() {
  const fiscalYear = prompt(
    'Fiscal Year to backup',
    ''
  );

  if (!fiscalYear) {
    return;
  }

  try {
    showLoading(
      'Preparing yearly backup...'
    );

    const data = await api(
      'adminExportYearBackup',
      {
        fiscalYear:
          fiscalYear
      }
    );

    const blob = new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          'application/json'
      }
    );

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        'a'
      );

    link.href =
      url;

    link.download =
      'Lions_Reporting_Backup_' +
      fiscalYear.replace(
        '/',
        '-'
      ) +
      '.json';

    document.body.appendChild(
      link
    );

    link.click();
    link.remove();

    URL.revokeObjectURL(
      url
    );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();
  }
}

async function changeAdminPassword() {
  const currentPassword =
    adminCurrentPassword.value;

  const newPassword =
    adminNewPassword.value;

  const confirmPassword =
    adminConfirmPassword.value;

  if (
    !currentPassword ||
    !newPassword ||
    !confirmPassword
  ) {
    alert(
      'All password fields are required.'
    );
    return;
  }

  if (
    newPassword !==
    confirmPassword
  ) {
    alert(
      'New password and confirmation do not match.'
    );
    return;
  }

  if (
    newPassword.length <
    6
  ) {
    alert(
      'New Admin password must be at least 6 characters.'
    );
    return;
  }

  if (
    !confirm(
      'Change Admin password now? You will be logged out from all Admin sessions.'
    )
  ) {
    return;
  }

  try {
    showLoading(
      'Changing Admin password...'
    );

    await api(
      'adminChangePassword',
      {
        currentPassword:
          currentPassword,
        newPassword:
          newPassword
      }
    );

    alert(
      'Admin password changed successfully. Please login again.'
    );

    TOKEN =
      '';

    USER =
      null;

    localStorage.removeItem(
      'zr_token'
    );

    location.reload();

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();
  }
}

async function previewLionsOfficerExcel() {
  const input = $(
    'lionsOfficerExcelFile'
  );

  const preview = $(
    'lionsExcelPreview'
  );

  const file =
    input &&
    input.files
      ? input.files[0]
      : null;

  if (!file) {
    alert(
      'Please select Lions Officer Contact Information Excel file.'
    );
    return;
  }

  if (
    typeof XLSX ===
    'undefined'
  ) {
    alert(
      'Excel reader library did not load. Please check internet connection and reload the page.'
    );
    return;
  }

  try {
    showLoading(
      'Reading Lions Excel and filtering President / Secretary...'
    );

    const buffer =
      await file.arrayBuffer();

    const workbook =
      XLSX.read(
        buffer,
        {
          type:
            'array',
          cellDates:
            false
        }
      );

    const firstSheet =
      workbook.Sheets[
        workbook.SheetNames[0]
      ];

    const rawRows =
      XLSX.utils.sheet_to_json(
        firstSheet,
        {
          defval:
            '',
          raw:
            false
        }
      );

    if (!rawRows.length) {
      throw new Error(
        'Excel file has no data.'
      );
    }

    let currentClubName =
      '';

    const filtered =
      [];

    rawRows.forEach(row => {
      const accountName = String(
        row['Account Name  ↑'] ||
        row['Account Name'] ||
        ''
      ).trim();

      if (accountName) {
        currentClubName =
          accountName;
      }

      const title = String(
        row['Official Title'] ||
        ''
      ).trim();

      if (
        ![
          'Club President',
          'Club Secretary'
        ].includes(
          title
        )
      ) {
        return;
      }

      const type = String(
        row['Type'] ||
        ''
      ).trim();

      if (
        type &&
        type !==
        'Lions Club'
      ) {
        return;
      }

      const firstName = String(
        row['Member: First Name'] ||
        ''
      ).trim();

      const middleName = String(
        row['Member: Middle Name'] ||
        ''
      ).trim();

      const lastName = String(
        row['Member: Last Name'] ||
        ''
      ).trim();

      const fullName = [
        firstName,
        middleName,
        lastName
      ]
        .filter(Boolean)
        .join(' ')
        .replace(
          /\s+/g,
          ' '
        )
        .trim();

      const email = String(
        row['Member: Personal Email'] ||
        ''
      )
        .trim()
        .toLowerCase();

      const validEmail =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
          email
        );

      filtered.push({
        LionID:
          String(
            row['Member: Member ID'] ||
            ''
          ).trim(),

        ClubID:
          String(
            row['Lion ID'] ||
            ''
          ).trim(),

        ClubName:
          currentClubName,

        OfficerName:
          fullName,

        Position:
          title ===
          'Club President'
            ? 'PRESIDENT'
            : 'SECRETARY',

        Email:
          validEmail
            ? email
            : '',

        Mobile:
          String(
            row['Member: Mobile'] ||
            ''
          ).trim(),

        StartDate:
          String(
            row['Start Date'] ||
            ''
          ).trim(),

        EndDate:
          String(
            row['End Date'] ||
            ''
          ).trim(),

        ParentRegion:
          String(
            row['Parent Region'] ||
            ''
          ).trim(),

        ParentZone:
          String(
            row['Parent Zone'] ||
            ''
          ).trim(),

        Source:
          'LIONS_EXCEL',

        EmailStatus:
          validEmail
            ? 'READY'
            : 'INVALID / MISSING EMAIL'
      });
    });

    if (!filtered.length) {
      throw new Error(
        'Club President / Club Secretary records were not found. Please confirm this is the Lions Officer Contact Information export.'
      );
    }

    LIONS_OFFICER_IMPORT_ROWS =
      filtered;

    renderLionsExcelPreview(
      filtered,
      file.name,
      rawRows.length
    );

  } catch (error) {
    preview.innerHTML = `
      <div class="notice error">
        ${esc(error.message)}
      </div>
    `;

  } finally {
    hideLoading();
  }
}

async function importLionsOfficerExcelData() {
  if (
    !LIONS_OFFICER_IMPORT_ROWS.length
  ) {
    alert(
      'Read and preview the Excel file first.'
    );
    return;
  }

  const fiscalYear =
    String(
      lionsImportFiscalYear.value ||
      ''
    ).trim();

  if (!fiscalYear) {
    alert(
      'Fiscal Year required. Example: 2026/27'
    );
    return;
  }

  const clubs =
    new Set(
      LIONS_OFFICER_IMPORT_ROWS.map(
        row =>
          row.ClubID
      )
    ).size;

  if (
    !confirm(
      'Import ' +
      LIONS_OFFICER_IMPORT_ROWS.length +
      ' President/Secretary records for ' +
      clubs +
      ' clubs in Fiscal Year ' +
      fiscalYear +
      '?'
    )
  ) {
    return;
  }

  try {
    showLoading(
      'Preparing Club master and officer verification data...'
    );

    const result = await api(
      'adminImportClubOfficers',
      {
        fiscalYear:
          fiscalYear,
        rows:
          LIONS_OFFICER_IMPORT_ROWS
      }
    );

    alert(
      'Import completed.\n\n' +
      'Officers: ' +
      result.imported +
      '\n' +
      'Clubs prepared: ' +
      result.clubsPrepared +
      '\n' +
      'Invalid/Missing Email: ' +
      result.invalidEmail
    );

    LIONS_OFFICER_IMPORT_ROWS =
      [];

    await loadAdminClubOfficers();

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();
  }
}

async function importZoneChairExcel() {
  const raw =
    zoneChairPaste.value.trim();

  if (!raw) {
    alert(
      'Paste Excel data first.'
    );

    return;

  }

  const lines = raw
    .split(/\r?\n/)
    .map(line => line.trimEnd())
    .filter(Boolean);

  const parsedRows = lines
    .map(line => line.split('\t'))
    .filter(columns => columns.length >= 8);

  if (!parsedRows.length) {
    alert(
      '8-column Excel data could not be detected.'
    );

    return;

  }

  const firstCell = String(
    parsedRows[0][0] ||
    ''
  )
    .trim()
    .toLowerCase();

  const dataRows =
    firstCell === 'zone id'
      ? parsedRows.slice(1)
      : parsedRows;

  const rows = dataRows.map(
    columns => ({
      'Zone ID': columns[0],
      'Official Title': columns[1],
      'Start Date': columns[2],
      'End Date': columns[3],
      'Member ID': columns[4],
      'Full Name': columns[5],
      'Personal Email': columns[6],
      'Mobile': columns[7]
    })
  );

  if (
    !confirm(
      rows.length +
      ' records import गरेर current master replace गर्ने?'
    )
  ) {
    return;

  }

  try {
    showLoading(
      'Importing Zone Chairperson master...'
    );

    const result = await api(
      'adminImportZoneChairpersons',
      {
        rows: rows,
        replaceMaster: true
      }
    );

    closeModal();

    await loadAdminZoneChairpersons();

    alert(
      result.imported +
      ' records imported successfully.'
    );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}
