<style>
:root{
  --blue:#123d73;--blue2:#0a2d59;--gold:#f3b51b;--bg:#f3f6fb;--card:#fff;
  --text:#1b2734;--muted:#6c7989;--line:#dce4ef;--ok:#1d8248;--bad:#b62929
}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.hide{display:none!important}
.topbar{min-height:68px;background:linear-gradient(90deg,var(--blue2),var(--blue));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 22px;position:sticky;top:0;z-index:20}
.brand{font-weight:800}.brand small{display:block;font-size:11px;font-weight:400;opacity:.78}.spacer{flex:1}.user-badge{font-size:13px}
.wrap{max-width:1280px;margin:20px auto;padding:0 15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #1636570b}
.login-shell{min-height:calc(100vh - 68px);display:grid;place-items:center}.login-card{width:min(430px,94vw)}
.logo-circle {
  width: 82px;
  height: 82px;
  border: 4px solid var(--gold);
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 0 auto 14px;
  background: #ffffff;
  overflow: hidden;
}

.login-logo {
  width: 66px;
  height: 66px;
  display: block;
  object-fit: contain;
}
h1,h2,h3{color:var(--blue);margin-top:0}.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#4b5969}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd6e2;border-radius:9px;background:#fff}textarea{min-height:86px;resize:vertical}
.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.btn-primary{background:var(--blue);color:#fff}.btn-gold{background:var(--gold);color:var(--blue2)}.btn-light{background:#edf3f9;color:var(--blue)}.btn-danger{background:#ffe9e9;color:#9d2020}.btn-ok{background:#e5f7ed;color:#176c3b}
.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:#f8fbff;border:1px solid var(--line);border-radius:13px;padding:15px}.kpi strong{display:block;font-size:28px;color:var(--blue)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}.tab.active{background:var(--blue);color:#fff}
.section{margin-bottom:19px}.section-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}.section-title h3{margin:0}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#edf4fb;color:var(--blue)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.right{text-align:right}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}th{background:#f5f8fc;color:var(--blue);position:sticky;top:0}
.status{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.st-SUBMITTED{background:#e5f7ed;color:#176d3c}.st-DRAFT{background:#fff3d9;color:#825d00}.st-PENDING{background:#edf1f5;color:#657383}.st-CORRECTION{background:#ffe9e9;color:#9a2323}
.notice{padding:10px 12px;border-radius:9px;background:#fff7dc;border:1px solid #ecd889;color:#6c5200;margin:9px 0}.notice.error{background:#ffeaea;border-color:#ffc8c8;color:#9d2323}.notice.ok{background:#e8f7ef;border-color:#bde8cf;color:#176a38}
.service-card{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px;background:#fcfdff}.service-head{display:flex;align-items:center;gap:8px}.service-head .spacer{flex:1}
.photo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo-preview{aspect-ratio:16/9;background:#edf2f7;border:1px dashed #aebdcc;border-radius:9px;display:grid;place-items:center;overflow:hidden}.photo-preview img{width:100%;height:100%;object-fit:cover}
.logo-preview{width:78px;height:78px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar .field{margin:0;min-width:190px}
#loading{position:fixed;inset:0;background:#071b3288;display:grid;place-items:center;z-index:999;color:#fff;font-weight:800}.spinner{width:46px;height:46px;border:5px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:#06182c99;z-index:80;display:grid;place-items:center;padding:16px}.modal-card{max-width:980px;width:100%;max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:18px}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}#printArea{display:block!important}
  @page{size:A4;margin:10mm}
  .p-cover{min-height:277mm;display:flex;flex-direction:column;justify-content:center;text-align:center;border-top:12mm solid #123d73;border-bottom:5mm solid #f3b51b;padding:14mm;page-break-after:always}
  .p-logo{width:33mm;height:33mm;object-fit:contain;margin:0 auto 8mm}.p-page{page-break-after:always}.p-head{border-bottom:2px solid #f3b51b;padding-bottom:4px;margin:0 0 8px;color:#123d73}
  .p-table{width:100%;border-collapse:collapse}.p-table th,.p-table td{border:1px solid #cbd5df;padding:5px;font-size:9.5px}
  .p-service{break-inside:avoid;border:1px solid #d5dfe9;border-radius:2mm;padding:6px;margin:0 0 6px}.p-service h4{margin:0 0 4px;color:#123d73;font-size:11px}
  .p-photos{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.p-photos.one{grid-template-columns:1fr}.p-photos img{width:100%;height:40mm;object-fit:cover;border-radius:1.5mm}
  .p-small{font-size:9.5px}.p-footer{text-align:center;font-size:8.5px;color:#687786;margin-top:8px}.p-sign{display:grid;grid-template-columns:1fr 1fr;gap:25mm;margin-top:20mm}.p-sign div{border-top:1px solid #444;padding-top:3px;text-align:center;font-size:9px}
}
@media(max-width:820px){.g2,.g3,.g4,.photo-row{grid-template-columns:1fr}.topbar{align-items:flex-start}.wrap{margin-top:12px}}

/* =========================================================
   VERIFIED ACCOUNT REGISTRATION
========================================================= */
.login-switch{margin-top:14px;text-align:center}.text-link{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline}.reg-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.reg-switch button{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);font-weight:700;cursor:pointer}.reg-switch button.active{background:var(--blue);color:#fff}

<body>
<div class="topbar">
<div class="brand">LIONS CLUB DIGITAL REPORTING <small>Club → Zone → District</small>
</div>
<div class="spacer">
</div>
<div id="userBadge" class="user-badge">
</div>
<button id="logoutBtn" class="btn btn-light hide" onclick="logout()">Logout</button>
</div>
<div id="loading" class="hide">
<div>
<div class="spinner">
</div>
<div id="loadingText">Processing...</div>
</div>
</div>
<div id="loginView" class="login-shell">
<div class="card login-card">
<div class="logo-circle">
<img
        src="logo.png"
        alt="Lions Club Logo"
        class="login-logo"
      >
</div>
<h2 style="text-align:center">System Login</h2>
<p class="muted" style="text-align:center">Club • Zone Chairperson • District Admin</p>
<div id="loginMsg">
</div>
<div class="field">
<label>Username</label>
<input id="username" autocomplete="username">
</div>
<div class="field">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password">
</div>
<button class="btn btn-primary" style="width:100%" onclick="login()">Login</button>
<div class="login-switch">
<span class="muted">President / Secretary / Zone Chairperson?</span>
<button
  class="text-link"
  onclick="openRegistration()"
>
  Create Account
</button>

&nbsp; | &nbsp;

<button
  class="text-link"
  onclick="openForgotPassword()"
>
  Forgot Password
</button>
</div>
</div>
</div>
<div id="appView" class="wrap hide">
<div id="clubApp" class="hide">
</div>
<div id="zoneApp" class="hide">
</div>
<div id="adminApp" class="hide">
</div>
</div>
<div id="modal" class="modal hide">
<div id="modalCard" class="modal-card">
</div>
</div>
<div id="printArea">
</div>

<script>
const API=(window.ZR_CONFIG&&window.ZR_CONFIG.API_URL)||'';

let TOKEN=localStorage.getItem('ZR_TOKEN')||'',USER=null,CLUB=null,CURRENT_REPORT=null;

let SERVICES=[],CONTRIBUTIONS=[],PROGRAMS=[],BLOOD=[],FUTURE=[],AUTO_SAVE_TIMER=null;

const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const num=v=>{const n=Number(v);

return Number.isFinite(n)?n:0};

const currentMonth=()=>new Date().toISOString().slice(0,7);

const money=n=>new Intl.NumberFormat().format(num(n));

function dateOnly(v){if(!v)return'';

const s=String(v);

if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);

return''}

function showLoading(t='Processing...'){$('loadingText').textContent=t;

$('loading').classList.remove('hide')}

function hideLoading(){$('loading').classList.add('hide')}

function showModal(html){$('modalCard').innerHTML=html;

$('modal').classList.remove('hide')}

function closeModal(){$('modal').classList.add('hide')}

function notice(id,text,type=''){$(id).innerHTML=`<div class="notice ${type}">${esc(text)}</div>`}

function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();

r.onload=()=>res(r.result);

r.onerror=rej;

r.readAsDataURL(f)})}

async function api(action,payload={},token=TOKEN){
  if(!API||API.includes('PASTE_YOUR')) throw new Error('config.js मा Apps Script Web App URL राख्नुहोस्।');

  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload,token})});

  const d=await res.json();

if(!d.ok)throw new Error(d.error||'Request failed');

return d;

}

/* =========================================================
   VERIFIED SELF REGISTRATION + EMAIL OTP
========================================================= */

let REGISTRATION_TYPE =
  'CLUB';

let REGISTRATION_OTP_REQUEST_ID =
  '';

async function openRegistration() {
  try {
    showLoading(
      'Loading registration...'
    );

    const info = await api(
      'registrationInfo',
      {},
      ''
    );

    REGISTRATION_TYPE =
      'CLUB';

    REGISTRATION_OTP_REQUEST_ID =
      '';

    showModal(`
      <div class="row">
        <h2>Create Account</h2>

        <div class="spacer"></div>

        <button
          class="btn btn-light"
          onclick="closeModal()"
        >
          Close
        </button>
      </div>

      <div class="notice ok">
        Current Fiscal Year:
        <b>${esc(info.fiscalYear || '')}</b>
        <br>
        Official email OTP verification is mandatory.
      </div>

      <div class="reg-switch">
        <button
          id="regClubTab"
          class="active"
          onclick="switchRegistration('CLUB')"
        >
          President / Secretary
        </button>

        <button
          id="regZoneTab"
          onclick="switchRegistration('ZONE')"
        >
          Zone Chairperson
        </button>
      </div>

      <div id="registrationForm"></div>
    `);

    renderRegistrationForm();

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

function switchRegistration(
  type
) {
  REGISTRATION_TYPE =
    type;

  REGISTRATION_OTP_REQUEST_ID =
    '';

  regClubTab.classList.toggle(
    'active',
    type ===
      'CLUB'
  );

  regZoneTab.classList.toggle(
    'active',
    type ===
      'ZONE'
  );

  renderRegistrationForm();

}

function renderRegistrationForm() {
  if (
    REGISTRATION_TYPE ===
    'CLUB'
  ) {
    registrationForm.innerHTML = `
      <div class="notice">
        केवल current President / Secretary।
        Lion ID + Club ID + official Personal Email match भएपछि
        Email OTP पठाइन्छ।
      </div>

      <div class="grid g2">
        <div class="field">
          <label>Lion ID</label>

          <input
            id="regLionId"
            inputmode="numeric"
          >
        </div>

        <div class="field">
          <label>Club ID</label>

          <input id="regClubId">
        </div>

        <div class="field">
          <label>Official Personal Email</label>

          <input
            id="regPersonalEmail"
            type="email"
          >
        </div>

        <div class="field">
          <label>Username</label>

          <input id="regUsername">
        </div>

        <div class="field">
          <label>Password</label>

          <input
            id="regPassword"
            type="password"
          >
        </div>

        <div class="field">
          <label>Confirm Password</label>

          <input
            id="regConfirm"
            type="password"
          >
        </div>
      </div>

      <button
        id="regSendOtpBtn"
        class="btn btn-light"
        onclick="sendRegistrationOtp()"
      >
        Send Email OTP
      </button>

      <div
        id="regOtpArea"
        class="hide"
        style="margin-top:14px"
      >
        <div
          id="regOtpMessage"
          class="notice ok"
        ></div>

        <div class="field">
          <label>6-digit Email OTP</label>

          <input
            id="regOtpCode"
            inputmode="numeric"
            maxlength="6"
          >
        </div>

        <button
          class="btn btn-primary"
          onclick="submitRegistration()"
        >
          Verify OTP & Create Club Account
        </button>
      </div>
    `;

  } else {
    registrationForm.innerHTML = `
      <div class="notice">
        Zone manually select गर्न पाइँदैन।
        Member ID + official Personal Email match भएपछि
        Email OTP पठाइन्छ र Zone automatically detect हुन्छ।
      </div>

      <div class="grid g2">
        <div class="field">
          <label>Member ID</label>

          <input
            id="regMemberId"
            inputmode="numeric"
          >
        </div>

        <div class="field">
          <label>Official Personal Email</label>

          <input
            id="regPersonalEmail"
            type="email"
          >
        </div>

        <div class="field">
          <label>Username</label>

          <input id="regUsername">
        </div>

        <div class="field">
          <label>Password</label>

          <input
            id="regPassword"
            type="password"
          >
        </div>

        <div class="field">
          <label>Confirm Password</label>

          <input
            id="regConfirm"
            type="password"
          >
        </div>
      </div>

      <button
        id="regSendOtpBtn"
        class="btn btn-light"
        onclick="sendRegistrationOtp()"
      >
        Send Email OTP
      </button>

      <div
        id="regOtpArea"
        class="hide"
        style="margin-top:14px"
      >
        <div
          id="regOtpMessage"
          class="notice ok"
        ></div>

        <div class="field">
          <label>6-digit Email OTP</label>

          <input
            id="regOtpCode"
            inputmode="numeric"
            maxlength="6"
          >
        </div>

        <button
          class="btn btn-primary"
          onclick="submitRegistration()"
        >
          Verify OTP & Create Zone Account
        </button>
      </div>
    `;

  }
}

async function sendRegistrationOtp() {
  try {
    showLoading(
      'Checking official data and sending Email OTP...'
    );

    let result;

    if (
      REGISTRATION_TYPE ===
      'CLUB'
    ) {
      result = await api(
        'sendClubRegistrationOtp',
        {
          lionId:
            regLionId.value.trim(),

          clubId:
            regClubId.value.trim(),

          personalEmail:
            regPersonalEmail.value.trim(),

          username:
            regUsername.value.trim()
        },
        ''
      );

    } else {
      result = await api(
        'sendZoneRegistrationOtp',
        {
          memberId:
            regMemberId.value.trim(),

          personalEmail:
            regPersonalEmail.value.trim(),

          username:
            regUsername.value.trim()
        },
        ''
      );

    }

    REGISTRATION_OTP_REQUEST_ID =
      result.requestId;

    regOtpArea.classList.remove(
      'hide'
    );

    regSendOtpBtn.textContent =
      'Resend Email OTP';

    regOtpMessage.textContent =
      'OTP sent to ' +
      result.maskedEmail +
      '.';

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

async function submitRegistration() {
  if (
    regPassword.value !==
    regConfirm.value
  ) {
    alert(
      'Password and Confirm Password do not match.'
    );

    return;

  }

  if (
    !REGISTRATION_OTP_REQUEST_ID
  ) {
    alert(
      'Send Email OTP first.'
    );

    return;

  }

  if (
    !regOtpCode.value.trim()
  ) {
    alert(
      'Enter the Email OTP.'
    );

    return;

  }

  try {
    showLoading(
      'Verifying OTP and creating account...'
    );

    let result;

    if (
      REGISTRATION_TYPE ===
      'CLUB'
    ) {
      result = await api(
        'registerClubOfficer',
        {
          lionId:
            regLionId.value.trim(),

          clubId:
            regClubId.value.trim(),

          personalEmail:
            regPersonalEmail.value.trim(),

          username:
            regUsername.value.trim(),

          password:
            regPassword.value,

          otpRequestId:
            REGISTRATION_OTP_REQUEST_ID,

          otpCode:
            regOtpCode.value.trim()
        },
        ''
      );

    } else {
      result = await api(
        'registerZoneChairperson',
        {
          memberId:
            regMemberId.value.trim(),

          personalEmail:
            regPersonalEmail.value.trim(),

          username:
            regUsername.value.trim(),

          password:
            regPassword.value,

          otpRequestId:
            REGISTRATION_OTP_REQUEST_ID,

          otpCode:
            regOtpCode.value.trim()
        },
        ''
      );

    }

    closeModal();

    const extra =
      result.zoneId
        ? '\nDetected Zone: ' +
          result.zoneId
        : result.clubName
          ? '\nClub: ' +
            result.clubName +
            ' | ' +
            (
              result.position ||
              ''
            )
          : '';

    alert(
      result.message +
      extra
    );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

/* =========================================================
   FORGOT PASSWORD - EMAIL OTP REQUIRED
========================================================= */

let PASSWORD_RESET_OTP_REQUEST_ID =
  '';

function openForgotPassword() {
  PASSWORD_RESET_OTP_REQUEST_ID =
    '';

  showModal(`
    <div class="row">
      <h2>Forgot Password</h2>

      <div class="spacer"></div>

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        Close
      </button>
    </div>

    <div class="notice">
      Password reset गर्न official registered Personal Email मा
      OTP verification अनिवार्य छ।
    </div>

    <div class="grid g2">
      <div class="field">
        <label>Username</label>

        <input id="resetUsername">
      </div>

      <div class="field">
        <label>Registered Personal Email</label>

        <input
          id="resetEmail"
          type="email"
        >
      </div>
    </div>

    <button
      id="resetSendOtpBtn"
      class="btn btn-light"
      onclick="sendPasswordResetOtp()"
    >
      Send Reset OTP
    </button>

    <div
      id="resetOtpArea"
      class="hide"
      style="margin-top:14px"
    >
      <div
        id="resetOtpMessage"
        class="notice ok"
      ></div>

      <div class="grid g2">
        <div class="field">
          <label>6-digit Email OTP</label>

          <input
            id="resetOtpCode"
            inputmode="numeric"
            maxlength="6"
          >
        </div>

        <div class="field">
          <label>New Password</label>

          <input
            id="resetNewPassword"
            type="password"
          >
        </div>

        <div class="field">
          <label>Confirm New Password</label>

          <input
            id="resetConfirmPassword"
            type="password"
          >
        </div>
      </div>

      <button
        class="btn btn-primary"
        onclick="completePasswordReset()"
      >
        Verify OTP & Reset Password
      </button>
    </div>
  `);

}

async function sendPasswordResetOtp() {
  try {
    showLoading(
      'Sending reset OTP...'
    );

    const result = await api(
      'sendPasswordResetOtp',
      {
        username:
          resetUsername.value.trim(),

        personalEmail:
          resetEmail.value.trim()
      },
      ''
    );

    PASSWORD_RESET_OTP_REQUEST_ID =
      result.requestId;

    resetOtpArea.classList.remove(
      'hide'
    );

    resetSendOtpBtn.textContent =
      'Resend Reset OTP';

    resetOtpMessage.textContent =
      'OTP sent to ' +
      result.maskedEmail +
      '.';

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

async function completePasswordReset() {
  if (
    resetNewPassword.value !==
    resetConfirmPassword.value
  ) {
    alert(
      'New Password and Confirm Password do not match.'
    );

    return;

  }

  if (
    !PASSWORD_RESET_OTP_REQUEST_ID
  ) {
    alert(
      'Send reset OTP first.'
    );

    return;

  }

async function saveDraft(
  silent = false
) {
  if (
    !CURRENT_REPORT ||
    CURRENT_REPORT.master.Status ===
      'SUBMITTED'
  ) {
    return;

  }

  try {
    if (!silent) {
      showLoading(
        'Saving shared Club draft...'
      );

    }

    const data = await api(
      'saveDraft',
      collectPayload()
    );

    CURRENT_REPORT =
      data.report;

    if (!silent) {
      loadReportIntoForm(
        data.report
      );

      alert(
        'Draft saved. President and Secretary will see the same latest data.'
      );

    }

  } catch (error) {
    const message = String(
      error.message ||
      ''
    );

    if (
      message.startsWith(
        'CONFLICT:'
      )
    ) {
      clearInterval(
        AUTO_SAVE_TIMER
      );

      if (!silent) {
        const reload = confirm(
          message +
          '\n\nReload latest shared data now?'
        );

        if (reload) {
          await reloadLatestSharedReport();

        }

      } else {
        alert(
          'Another President/Secretary login saved a newer report revision. Auto-save stopped. Reload the latest report before continuing.'
        );

      }

      return;

    }

    if (!silent) {
      alert(
        error.message
      );

    }

  } finally {
    if (!silent) {
      hideLoading();

    }
  }
}

async function reloadLatestSharedReport() {
  if (!CURRENT_REPORT) {
    return;

  }

  try {
    showLoading(
      'Loading latest shared report...'
    );

    const data = await api(
      'getReport',
      {
        reportId:
          CURRENT_REPORT.master.ReportID
      }
    );

    loadReportIntoForm(
      data.report
    );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

if(CURRENT_REPORT&&CURRENT_REPORT.master.Status!=='SUBMITTED')AUTO_SAVE_TIMER=setInterval(()=>saveDraft(true),60000)}

function adminTab(name, button) {
  document
    .querySelectorAll('#adminApp .tab')
    .forEach(tab => tab.classList.remove('active'));

  button.classList.add('active');

  [
    'Dashboard',
    'Users',
    'Clubs',
    'Zonechairs',
    'Mapping',
    'Year'
  ].forEach(section => {
    $('admin' + section + 'Tab').classList.add('hide');

  });

  $(
    'admin' +
    name[0].toUpperCase() +
    name.slice(1) +
    'Tab'
  ).classList.remove('hide');

  if (name === 'users') {
    loadAdminUsers();

  }

  if (name === 'clubs') {
    loadAdminClubs();

  }

  if (name === 'zonechairs') {
    loadAdminZoneChairpersons();

  }

  if (name === 'mapping') {
    loadAdminMappings();

  }

  if (
    name ===
    'year'
  ) {
    loadAdminYearSettings();

  }
}

    await loadAdminZoneChairpersons();

    alert(
      'Zone Chairperson record saved.'
    );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

function openZoneChairImport() {
  showModal(`
    <div class="row">
      <h2>Paste Zone Chairperson Excel Data</h2>

      <div class="spacer"></div>

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        Close
      </button>
    </div>

    <div class="notice">
      Excel बाट 8 columns select गरेर Copy गर्नुहोस् र तल Paste गर्नुहोस्।
      Header row भए automatically skip हुन्छ।
    </div>

    <div class="field">
      <label>
        Zone ID | Official Title | Start Date | End Date |

      </label>

      <textarea
        id="zoneChairPaste"

      ></textarea>
    </div>

    <div class="notice error">
      Import गर्दा current Zone_Chairpersons master replace हुन्छ।
    </div>

      onclick="importZoneChairExcel()"
    >

    </button>
  `);

}

async function importZoneChairExcel() {
  const raw =
    zoneChairPaste.value.trim();

  if (!raw) {
    alert(
      'Paste Excel data first.'
    );

    return;

  }

  const lines = raw
    .split(/\r?\n/)
    .map(line => line.trimEnd())
    .filter(Boolean);

  const parsedRows = lines
    .map(line => line.split('\t'))
    .filter(columns => columns.length >= 8);

  if (!parsedRows.length) {
    alert(
      '8-column Excel data could not be detected.'
    );

    return;

  }

  const firstCell = String(
    parsedRows[0][0] ||
    ''
  )
    .trim()
    .toLowerCase();

  const dataRows =
    firstCell === 'zone id'
      ? parsedRows.slice(1)
      : parsedRows;

  const rows = dataRows.map(
    columns => ({
      'Zone ID': columns[0],
      'Official Title': columns[1],
      'Start Date': columns[2],
      'End Date': columns[3],
      'Member ID': columns[4],
      'Full Name': columns[5],
      'Personal Email': columns[6],
      'Mobile': columns[7]
    })
  );

  if (
    !confirm(
      rows.length +
      ' records import गरेर current master replace गर्ने?'
    )
  ) {
    return;

  }

  try {
    showLoading(
      'Importing Zone Chairperson master...'
    );

    const result = await api(
      'adminImportZoneChairpersons',
      {
        rows: rows,
        replaceMaster: true
      }
    );

    closeModal();

    await loadAdminZoneChairpersons();

    alert(
      result.imported +
      ' records imported successfully.'
    );

  } catch (error) {
    alert(
      error.message
    );

  } finally {
    hideLoading();

  }
}

async function loadAdminMappings(){try{showLoading('Loading mappings...');

const [m,u,c]=await Promise.all([api('adminListMappings'),api('adminListUsers'),api('adminListClubs')]);

const zoneUsers=u.users.filter(x=>x.role==='ZONE'&&x.active);

adminMappingTab.innerHTML=`<div class="card"><div class="section-title"><h2>Zone → Club Mapping</h2><div class="spacer"></div><button class="btn btn-gold" onclick='openMappingForm(${JSON.stringify(c.clubs)},${JSON.stringify(zoneUsers)})'>+ Add Mapping</button></div><div class="notice">एक Zone Chairperson को under मा सामान्यतया 4–8 clubs mapping गर्न सकिन्छ। Zone Chairperson login भएपछि यही mapping अनुसार clubs मात्र देखिन्छन्।</div><div class="table-wrap"><table><tr><th>Zone</th><th>Club</th><th>Chairperson User ID</th><th>Status</th><th>Action</th></tr>${m.mappings.map(x=>`<tr><td>${esc(x.ZoneID)} ${esc(x.ZoneName||'')}</td><td>${esc(x.ClubName)} (${esc(x.ClubID)})</td><td>${esc(x.ChairpersonUserID||'-')}</td><td>${esc(x.Active)}</td><td><button class="btn ${String(x.Active)==='TRUE'?'btn-danger':'btn-ok'}" onclick="setMappingActive('${esc(x.MapID)}',${String(x.Active)!=='TRUE'})">${String(x.Active)==='TRUE'?'Deactivate':'Activate'}</button></td></tr>`).join('')}</table></div></div>`}catch(e){adminMappingTab.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}finally{hideLoading()}}

function openMappingForm(clubs,zoneUsers){showModal(`<div class="row"><h2>Add Zone Mapping</h2><div class="spacer"></div><button class="btn btn-light" onclick="closeModal()">Close</button></div><div class="grid g2"><div class="field"><label>Club</label><select id="amClub" onchange="fillZoneFromClub()">${clubs.map(c=>`<option value="${esc(c.ClubID)}" data-zone="${esc(c.ZoneID)}" data-zname="${esc(c.ZoneName||'')}">${esc(c.ClubName)} (${esc(c.ClubID)})</option>`).join('')}</select></div><div class="field"><label>Zone Chairperson</label><select id="amChair"><option value="">-- Select --</option>${zoneUsers.map(u=>`<option value="${esc(u.userId)}" data-zone="${esc(u.zoneId)}">${esc(u.displayName)} — ${esc(u.zoneId)}</option>`).join('')}</select></div><div class="field"><label>Zone ID</label><input id="amZone"></div><div class="field"><label>Zone Name</label><input id="amZoneName"></div></div><button class="btn btn-primary" onclick="saveMapping()">Save Mapping</button>`);

fillZoneFromClub()}

function fillZoneFromClub(){const o=amClub.options[amClub.selectedIndex];

amZone.value=o?.dataset.zone||'';

amZoneName.value=o?.dataset.zname||''}

async function saveMapping(){try{showLoading('Saving mapping...');

await api('adminSaveMapping',{ClubID:amClub.value,ZoneID:amZone.value,ZoneName:amZoneName.value,ChairpersonUserID:amChair.value,Active:true});

closeModal();

loadAdminMappings()}catch(e){alert(e.message)}finally{hideLoading()}}

async function setMappingActive(id,active){try{await api('adminSetMappingActive',{mapId:id,active});

loadAdminMappings()}catch(e){alert(e.message)}}

restore();
</script>
