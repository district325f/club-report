<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lions Club Digital Reporting</title><script src="config.js"></script>
<style>
:root{--b:#123d73;--g:#f5b51b;--bg:#f4f7fb;--line:#dce4ef;--t:#1d2733}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}
header{background:var(--b);color:white;padding:16px 22px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}header b{font-size:18px}.sp{flex:1}
.wrap{max-width:1200px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px #0c27470d}
.login{max-width:430px;margin:70px auto}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}.field label{font-size:12px;font-weight:700;color:#526174}
input,select,textarea{padding:10px;border:1px solid #cbd6e3;border-radius:9px;width:100%}textarea{min-height:80px}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.primary{background:var(--b);color:#fff}.gold{background:var(--g);color:var(--b)}.light{background:#eef3f9;color:var(--b)}.danger{background:#feeaea;color:#9c1e1e}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:#f8fbff;border:1px solid var(--line);border-radius:12px;padding:14px}.kpi strong{display:block;font-size:27px;color:var(--b)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:white;cursor:pointer}.tabs .active{background:var(--b);color:white}
.hide{display:none!important}.service{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#edf2f7}.SUBMITTED{background:#e4f6ec;color:#15713b}.DRAFT{background:#fff3d7;color:#805f00}.PENDING{background:#eef1f5;color:#606f80}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{background:#f5f8fc;color:var(--b)}
.notice{padding:10px;border-radius:9px;background:#fff6d9;border:1px solid #ecd78e;margin:9px 0}.err{background:#ffeaea;border-color:#ffc8c8;color:#9d2424}.ok{background:#e8f7ef;border-color:#bfe8d0;color:#176a38}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ph{aspect-ratio:16/9;background:#edf2f7;border:1px dashed #aab8c6;border-radius:8px;display:grid;place-items:center;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
#loading{position:fixed;inset:0;background:#0b1f3688;color:white;display:grid;place-items:center;z-index:99;font-size:18px;font-weight:bold}
#printArea{display:none}
@media print{
body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{size:A4;margin:10mm}
.cover{min-height:275mm;display:flex;flex-direction:column;justify-content:center;text-align:center;border-top:10mm solid #123d73;border-bottom:4mm solid #f5b51b;page-break-after:always}
.cover img{width:32mm;height:32mm;object-fit:contain;margin:0 auto 8mm}.page{page-break-after:always}.head{color:#123d73;border-bottom:2px solid #f5b51b;padding-bottom:4px}
.pt{width:100%;border-collapse:collapse}.pt th,.pt td{border:1px solid #ccd6e1;padding:5px;font-size:9.5px}.ps{break-inside:avoid;border-bottom:1px solid #d4dde8;padding:7px 0}.ps h4{color:#123d73;margin:0 0 5px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:5px}.pp.one{grid-template-columns:1fr}.pp img{width:100%;height:42mm;object-fit:cover}
}
@media(max-width:760px){.g2,.g3,.g4,.photos{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>Lions Club Digital Reporting</b><span>Club → Zone</span><div class="sp"></div><span id="who"></span><button id="logoutBtn" class="btn light hide" onclick="logout()">Logout</button></header>
<div id="loading" class="hide">Processing...</div>

<div id="loginBox" class="wrap"><div class="card login"><h2>System Login</h2><div id="loginMsg"></div><div class="field"><label>Username</label><input id="username"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="login()">Login</button></div></div>

<div id="app" class="wrap hide">
  <div id="clubUI" class="hide"></div>
  <div id="zoneUI" class="hide"></div>
</div>
<div id="printArea"></div>

<script>
const API=window.ZR_CONFIG?.API_URL||'';let TOKEN=localStorage.getItem('ZR_TOKEN')||'',USER=null,CLUB=null,R=null,S=[],C=[],P=[],F=[];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), num=v=>isFinite(Number(v))?Number(v):0, month=()=>new Date().toISOString().slice(0,7), date=v=>{if(!v)return'';let s=String(v);return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):''};
function load(on,t='Processing...'){$('loading').textContent=t;$('loading').classList.toggle('hide',!on)}
async function api(action,payload={},token=TOKEN){if(!API||API.includes('PASTE_'))throw Error('config.js मा Apps Script URL राख्नुहोस्');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload,token})});const d=await r.json();if(!d.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{load(1,'Logging in...');const d=await api('login',{username:username.value,password:password.value},'');TOKEN=d.token;USER=d.user;localStorage.setItem('ZR_TOKEN',TOKEN);enter()}catch(e){loginMsg.innerHTML=`<div class="notice err">${esc(e.message)}</div>`}finally{load(0)}}
async function logout(){try{await api('logout')}catch(e){}localStorage.removeItem('ZR_TOKEN');location.reload()}
async function restore(){if(!TOKEN)return;try{const d=await api('me');USER=d.user;enter()}catch(e){localStorage.removeItem('ZR_TOKEN')}}
function enter(){loginBox.classList.add('hide');app.classList.remove('hide');logoutBtn.classList.remove('hide');who.textContent=`${USER.displayName} • ${USER.role}`;if(USER.role==='CLUB'){clubUI.classList.remove('hide');clubShell();clubDash()}else{zoneUI.classList.remove('hide');zoneShell();zoneDash()}}
function clubShell(){clubUI.innerHTML=`<div class="tabs"><button class="active" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('report',this)">Report</button><button onclick="tab('profile',this)">Club Profile</button></div><div id="dash"></div><div id="report" class="hide"></div><div id="profile" class="hide"></div>`}
function tab(n,b){document.querySelectorAll('#clubUI .tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['dash','report','profile'].forEach(x=>$(x).classList.add('hide'));$(n).classList.remove('hide')}
async function clubDash(){try{load(1,'Loading dashboard...');const d=await api('clubDashboard');CLUB=d.club;dash.innerHTML=`<div class="grid g3"><div class="kpi">Club<strong style="font-size:18px">${esc(CLUB?.ClubName||'')}</strong></div><div class="kpi">Reports<strong>${d.reports.length}</strong></div><div class="kpi">Current Month<strong style="font-size:21px">${month()}</strong></div></div><div class="card"><div class="row"><h3>My Reports</h3><div class="sp"></div><button class="btn gold" onclick="newReport()">+ New Report</button></div><table><tr><th>Month</th><th>Status</th><th>Members</th><th>Action</th></tr>${d.reports.map(r=>`<tr><td>${esc(r.ReportingMonth)}</td><td><span class="status ${esc(r.Status)}">${esc(r.Status)}</span></td><td>${r.TotalMembers||0}</td><td><button class="btn light" onclick="openReport('${esc(r.ReportID)}')">${r.Status==='SUBMITTED'?'View':'Edit'}</button>${r.Status==='SUBMITTED'?` <button class="btn light" onclick="printId('${esc(r.ReportID)}')">PDF / Print</button> <button class="btn light" onclick="correction('${esc(r.ReportID)}')">Correction</button>`:''}</td></tr>`).join('')}</table></div>`;renderProfile()}catch(e){dash.innerHTML=`<div class="notice err">${esc(e.message)}</div>`}finally{load(0)}}
function renderProfile(){profile.innerHTML=`<div class="card"><h3>Club Profile</h3><div class="grid g2"><div class="field"><label>Club Logo</label><input type="file" id="logoFile" accept="image/*">${CLUB?.ClubLogoURL?`<img src="${esc(CLUB.ClubLogoURL)}" style="width:80px;height:80px;object-fit:contain">`:''}</div><div></div><div class="field"><label>Club Name</label><input id="clubName" value="${esc(CLUB?.ClubName||'')}"></div><div class="field"><label>Charter Date</label><input id="charter" type="date" value="${date(CLUB?.CharterDate)}"></div><div class="field"><label>President</label><input id="president" value="${esc(CLUB?.PresidentName||'')}"></div><div class="field"><label>Secretary</label><input id="secretary" value="${esc(CLUB?.SecretaryName||'')}"></div></div><div class="row"><button class="btn primary" onclick="saveProfile()">Save Profile</button><button class="btn light" onclick="saveLogo()">Upload Logo</button></div></div>`}
async function saveProfile(){try{load(1);await api('saveClubProfile',{ClubName:clubName.value,CharterDate:charter.value,PresidentName:president.value,SecretaryName:secretary.value});await clubDash();alert('Saved')}catch(e){alert(e.message)}finally{load(0)}}
async function saveLogo(){if(!logoFile.files[0])return alert('Select logo');try{load(1,'Uploading logo...');await api('saveClubLogo',{dataUrl:await fileData(logoFile.files[0])});await clubDash()}catch(e){alert(e.message)}finally{load(0)}}
async function newReport(){const m=prompt('Reporting Month (YYYY-MM)',month());if(!m)return;try{load(1);const d=await api('getOrCreateDraft',{reportingMonth:m});setReport(d.report);tab('report',document.querySelectorAll('#clubUI .tabs button')[1])}catch(e){alert(e.message)}finally{load(0)}}
async function openReport(id){try{load(1);const d=await api('getReport',{reportId:id});setReport(d.report);tab('report',document.querySelectorAll('#clubUI .tabs button')[1])}catch(e){alert(e.message)}finally{load(0)}}
function setReport(r){R=r;S=(r.services||[]).map(x=>({...x,photos:[]}));C=r.contributions||[];P=r.programs||[];F=r.futurePlans||[];renderReport()}
function renderReport(){const m=R.master,lock=m.Status==='SUBMITTED';report.innerHTML=`<div class="card"><div class="row"><h2>Report – ${esc(m.ReportingMonth)}</h2><div class="sp"></div><span class="status ${esc(m.Status)}">${esc(m.Status)}</span></div>${lock?'<div class="notice">Final submitted report is locked.</div>':''}<h3>Membership</h3><div class="grid g4">${nf('Opening','op',m.OpeningMembers,lock)}${nf('Added','ad',m.AddedMembers,lock)}${nf('Dropped','dr',m.DroppedMembers,lock)}${nf('Total','to',m.TotalMembers,true)}${nf('Male','ma',m.MaleMembers,lock)}${nf('Female','fe',m.FemaleMembers,lock)}${tf('Start','st',date(m.PeriodStart),'date',lock)}${tf('End','en',date(m.PeriodEnd),'date',lock)}</div><div id="mcheck" class="notice"></div><h3>Dues / Reporting</h3><div class="grid g3">${sel('International Dues','intl',m.InternationalDues,['','Clear','Pending'],lock)}${sel('District Dues','dist',m.DistrictDues,['','Clear','Pending'],lock)}${sel('Portal Reporting','portal',m.PortalReporting,['','Reported','Pending'],lock)}${sel('Zone Meeting','zm',m.ZoneMeeting,['','Participated','Not Participated'],lock)}${sel('District Program','dp',m.DistrictProgram,['','Participated','Not Participated'],lock)}</div><div class="row"><h3>Service Activities</h3><div class="sp"></div>${!lock?'<button class="btn gold" onclick="addService()">+ Add Service</button>':''}</div><div id="services"></div><div class="row"><h3>Contributions</h3><div class="sp"></div>${!lock?'<button class="btn light" onclick="addContrib()">+ Add</button>':''}</div><div id="contrib"></div><div class="row"><h3>Participated Programs</h3><div class="sp"></div>${!lock?'<button class="btn light" onclick="addProgram()">+ Add</button>':''}</div><div id="programs"></div><div class="row"><h3>Future Plans</h3><div class="sp"></div>${!lock?'<button class="btn light" onclick="addFuture()">+ Add</button>':''}</div><div id="future"></div><div class="field"><label>Notes</label><textarea id="notes" ${lock?'disabled':''}>${esc(m.Notes||'')}</textarea></div><div class="row">${!lock?'<button class="btn primary" onclick="saveDraft()">Save Draft</button><button class="btn gold" onclick="submitFinal()">Final Submit to Zone</button>':''}<button class="btn light" onclick="printNow()">Preview / PDF / Print</button></div></div>`;['op','ad','dr','ma','fe'].forEach(i=>$(i)?.addEventListener('input',calc));drawServices(lock);drawContrib(lock);drawPrograms(lock);drawFuture(lock);calc()}
function nf(l,i,v,d){return `<div class="field"><label>${l}</label><input id="${i}" type="number" min="0" value="${esc(v||0)}" ${d?'disabled':''}></div>`}function tf(l,i,v,t,d){return `<div class="field"><label>${l}</label><input id="${i}" type="${t}" value="${esc(v||'')}" ${d?'disabled':''}></div>`}function sel(l,i,v,a,d){return `<div class="field"><label>${l}</label><select id="${i}" ${d?'disabled':''}>${a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function calc(){const t=num(op?.value)+num(ad?.value)-num(dr?.value);if(to)to.value=t;if(mcheck){const ok=num(ma?.value)+num(fe?.value)===t;mcheck.className='notice '+(ok?'ok':'err');mcheck.textContent=`Total ${t} | Male + Female ${num(ma?.value)+num(fe?.value)} ${ok?'✓':'— Final Submit अघि मिलाउनुहोस्'}`}}
function addService(){S.push({Title:'',ServiceDate:'',Category:'',Description:'',Beneficiaries:0,Units:0,Amount:0,Photo1URL:'',Photo2URL:'',photos:[]});drawServices(false)}
function drawServices(lock){services.innerHTML=S.map((s,i)=>`<div class="service"><div class="row"><b>Service #${i+1}</b><div class="sp"></div>${!lock?`<button class="btn danger" onclick="S.splice(${i},1);drawServices(false)">Delete</button>`:''}</div><div class="grid g3">${sf(i,'Title','Service Title',s.Title,lock)}${sf(i,'ServiceDate','Date',date(s.ServiceDate),lock,'date')}${sf(i,'Category','Category',s.Category,lock)}${sf(i,'Beneficiaries','Beneficiaries',s.Beneficiaries,lock,'number')}${sf(i,'Units','Units',s.Units,lock,'number')}${sf(i,'Amount','Amount',s.Amount,lock,'number')}</div><div class="field"><label>Description</label><textarea ${lock?'disabled':''} oninput="S[${i}].Description=this.value">${esc(s.Description||'')}</textarea></div><div class="photos"><div><label>Photo 1</label>${!lock?`<input type="file" accept="image/*" onchange="photo(${i},0,this)">`:''}<div class="ph">${s.Photo1URL?`<img src="${esc(s.Photo1URL)}">`:'Photo 1'}</div></div><div><label>Photo 2</label>${!lock?`<input type="file" accept="image/*" onchange="photo(${i},1,this)">`:''}<div class="ph">${s.Photo2URL?`<img src="${esc(s.Photo2URL)}">`:'Photo 2'}</div></div></div></div>`).join('')||'<div>No services added.</div>'}
function sf(i,k,l,v,d,t='text'){return `<div class="field"><label>${l}</label><input type="${t}" value="${esc(v||'')}" ${d?'disabled':''} oninput="S[${i}].${k}=this.value"></div>`}
async function photo(i,slot,el){if(!el.files[0])return;const d=await fileData(el.files[0]);S[i].photos=S[i].photos||[];S[i].photos[slot]=d;if(slot===0)S[i].Photo1URL=d;else S[i].Photo2URL=d;drawServices(false)}
function addContrib(){C.push({Type:'',ContributionDate:'',Amount:0,Currency:'NPR',Remarks:''});drawContrib(false)}function drawContrib(lock){contrib.innerHTML=C.map((x,i)=>`<div class="service grid g4">${mi('C',i,'Type','Type',x.Type,lock)}${mi('C',i,'ContributionDate','Date',date(x.ContributionDate),lock,'date')}${mi('C',i,'Amount','Amount',x.Amount,lock,'number')}${mi('C',i,'Remarks','Remarks',x.Remarks,lock)}${!lock?`<button class="btn danger" onclick="C.splice(${i},1);drawContrib(false)">Delete</button>`:''}</div>`).join('')}
function addProgram(){P.push({Level:'Club Level',Title:'',ProgramDate:'',Remarks:''});drawPrograms(false)}function drawPrograms(lock){programs.innerHTML=P.map((x,i)=>`<div class="service grid g4">${mi('P',i,'Level','Level',x.Level,lock)}${mi('P',i,'Title','Title',x.Title,lock)}${mi('P',i,'ProgramDate','Date',date(x.ProgramDate),lock,'date')}${mi('P',i,'Remarks','Remarks',x.Remarks,lock)}${!lock?`<button class="btn danger" onclick="P.splice(${i},1);drawPrograms(false)">Delete</button>`:''}</div>`).join('')}
function addFuture(){F.push({Title:'',TentativeDate:'',Remarks:''});drawFuture(false)}function drawFuture(lock){future.innerHTML=F.map((x,i)=>`<div class="service grid g3">${mi('F',i,'Title','Title',x.Title,lock)}${mi('F',i,'TentativeDate','Date',date(x.TentativeDate),lock,'date')}${mi('F',i,'Remarks','Remarks',x.Remarks,lock)}${!lock?`<button class="btn danger" onclick="F.splice(${i},1);drawFuture(false)">Delete</button>`:''}</div>`).join('')}
function mi(a,i,k,l,v,d,t='text'){return `<div class="field"><label>${l}</label><input type="${t}" value="${esc(v||'')}" ${d?'disabled':''} oninput="${a}[${i}].${k}=this.value"></div>`}
function payload(){return{reportId:R.master.ReportID,master:{periodStart:st.value,periodEnd:en.value,openingMembers:op.value,addedMembers:ad.value,droppedMembers:dr.value,maleMembers:ma.value,femaleMembers:fe.value,internationalDues:intl.value,districtDues:dist.value,portalReporting:portal.value,zoneMeeting:zm.value,districtProgram:dp.value,notes:notes.value},services:S,contributions:C,programs:P,futurePlans:F}}
async function saveDraft(){try{load(1,'Saving draft...');const d=await api('saveDraft',payload());setReport(d.report);alert('Draft saved')}catch(e){alert(e.message)}finally{load(0)}}
async function submitFinal(){calc();if(num(ma.value)+num(fe.value)!==num(to.value))return alert('Male + Female must equal Total');if(!confirm('Final Submit गरेपछि report lock हुन्छ। Continue?'))return;try{load(1,'Submitting...');const d=await api('submitFinal',payload());setReport(d.report);await clubDash();alert('Submitted to Zone Chairperson')}catch(e){alert(e.message)}finally{load(0)}}
async function correction(id){const reason=prompt('Correction reason');if(!reason)return;try{await api('requestCorrection',{reportId:id,reason});alert('Request sent')}catch(e){alert(e.message)}}
async function printId(id){try{load(1);const d=await api('getReport',{reportId:id});makePrint(d.report);window.print()}catch(e){alert(e.message)}finally{load(0)}}function printNow(){makePrint(R);window.print()}
function makePrint(r){const m=r.master,c=r.club||{},s=r.services||S,co=r.contributions||C,pr=r.programs||P,fu=r.futurePlans||F;printArea.innerHTML=`<section class="cover">${c.ClubLogoURL?`<img src="${esc(c.ClubLogoURL)}">`:''}<h1>${esc(m.ClubNameSnapshot||c.ClubName||'Lions Club')}</h1><h2>MONTHLY CLUB REPORT</h2><p>${esc(m.PeriodStart)} to ${esc(m.PeriodEnd)}</p><p>Zone: ${esc(m.ZoneID)}</p><div style="margin-top:25mm"><b>President:</b> ${esc(m.PresidentSnapshot||'')}<br><b>Secretary:</b> ${esc(m.SecretarySnapshot||'')}</div></section><section class="page"><h2 class="head">Club & Membership Summary</h2><table class="pt"><tr><th>Charter</th><th>Opening</th><th>Add</th><th>Drop</th><th>Total</th><th>Male</th><th>Female</th><th>Net</th></tr><tr><td>${esc(m.CharterDateSnapshot)}</td><td>${m.OpeningMembers}</td><td>${m.AddedMembers}</td><td>${m.DroppedMembers}</td><td>${m.TotalMembers}</td><td>${m.MaleMembers}</td><td>${m.FemaleMembers}</td><td>${m.NetGrowth}</td></tr></table><h2 class="head">Dues / Reporting</h2><table class="pt"><tr><th>International</th><th>District</th><th>Portal</th><th>Zone Meeting</th><th>District Program</th></tr><tr><td>${esc(m.InternationalDues)}</td><td>${esc(m.DistrictDues)}</td><td>${esc(m.PortalReporting)}</td><td>${esc(m.ZoneMeeting)}</td><td>${esc(m.DistrictProgram)}</td></tr></table>${co.length?`<h2 class="head">Contributions</h2><table class="pt"><tr><th>Type</th><th>Date</th><th>Amount</th><th>Remarks</th></tr>${co.map(x=>`<tr><td>${esc(x.Type)}</td><td>${esc(date(x.ContributionDate))}</td><td>${esc(x.Amount)} ${esc(x.Currency||'NPR')}</td><td>${esc(x.Remarks||'')}</td></tr>`).join('')}</table>`:''}${pr.length?`<h2 class="head">Participated Programs</h2><table class="pt">${pr.map(x=>`<tr><td>${esc(x.Level)}</td><td>${esc(x.Title)}</td><td>${esc(date(x.ProgramDate))}</td></tr>`).join('')}</table>`:''}</section><section class="page"><h2 class="head">Service Activities</h2>${s.map((x,i)=>`<div class="ps"><h4>${i+1}. ${esc(x.Title||'Service')} ${x.ServiceDate?'— '+esc(date(x.ServiceDate)):''}</h4><div style="font-size:9.5px">${esc(x.Category||'')} ${x.Beneficiaries?' | Beneficiaries: '+esc(x.Beneficiaries):''}</div><p style="font-size:9.5px">${esc(x.Description||'')}</p>${x.Photo1URL||x.Photo2URL?`<div class="pp ${x.Photo1URL&&x.Photo2URL?'':'one'}">${x.Photo1URL?`<img src="${esc(x.Photo1URL)}">`:''}${x.Photo2URL?`<img src="${esc(x.Photo2URL)}">`:''}</div>`:''}</div>`).join('')}</section><section><h2 class="head">Future Plans</h2><table class="pt">${fu.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.Title)}</td><td>${esc(date(x.TentativeDate))}</td><td>${esc(x.Remarks||'')}</td></tr>`).join('')}</table></section>`}
function zoneShell(){zoneUI.innerHTML=`<div class="card"><h2>Zone Chairperson Dashboard</h2><div class="row"><div class="field" style="width:220px"><label>Reporting Month</label><input id="zmonth" type="month" value="${month()}"></div><button class="btn primary" onclick="zoneDash()">Load</button></div><div id="zcontent"></div></div>`}
async function zoneDash(){try{load(1,'Loading Zone reports...');const d=await api('zoneDashboard',{reportingMonth:zmonth.value});zcontent.innerHTML=`<div class="grid g4"><div class="kpi">Total Clubs<strong>${d.summary.totalClubs}</strong></div><div class="kpi">Submitted<strong>${d.summary.submitted}</strong></div><div class="kpi">Pending/Draft<strong>${d.summary.pending+d.summary.draft}</strong></div><div class="kpi">Services<strong>${d.summary.totalServices}</strong></div></div><div class="card"><table><tr><th>Club</th><th>Status</th><th>Members</th><th>Services</th><th>Contribution</th><th>Action</th></tr>${d.clubs.map(c=>`<tr><td>${esc(c.clubName)}</td><td><span class="status ${esc(c.status)}">${esc(c.status)}</span></td><td>${c.totalMembers}</td><td>${c.serviceCount}</td><td>${c.contributionTotal}</td><td>${c.status==='SUBMITTED'?`<button class="btn light" onclick="zoneReport('${esc(c.reportId)}')">View / PDF</button>`:'-'}</td></tr>`).join('')}</table></div>`}catch(e){zcontent.innerHTML=`<div class="notice err">${esc(e.message)}</div>`}finally{load(0)}}
async function zoneReport(id){try{load(1);const d=await api('zoneGetClubReport',{reportId:id});makePrint(d.report);window.print()}catch(e){alert(e.message)}finally{load(0)}}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
restore();
</script>
